[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/ports",
    "crates/application",
    "crates/config",
    "crates/adapters/statefile",
    "crates/adapters/ws-support",
    "crates/adapters/pumpfun",
    "crates/adapters/evm-onchain",
    "bin/runner",
    "bin/backtest",
]

# Centralising versions here means every crate in the workspace pulls the
# same version of a dependency, which keeps compile times sane and avoids
# the classic "two versions of tokio in one binary" problem.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Pulled in directly (not just transitively via reqwest/tokio-tungstenite)
# so the runner can explicitly install a single process-wide crypto
# provider at startup. reqwest's `rustls-tls` and tokio-tungstenite's
# `rustls-tls-webpki-roots` don't agree on a default backend (aws-lc-rs
# vs ring), and having both linked in leaves rustls unable to
# auto-select one - it panics on the first TLS handshake instead of
# guessing. `ring` is the deliberate choice here, not aws-lc-rs: this
# project ships an Android/Termux build (see the release workflow),
# and aws-lc-rs needs a C/C++ toolchain (cmake, clang) to build, which
# is a much rougher requirement on Termux than ring's prebuilt-friendly
# pure-Rust-plus-assembly approach.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
config = "0.14"
rust_decimal = { version = "1", features = ["serde-str"] }

ben_snipes-domain = { path = "crates/domain" }
ben_snipes-ports = { path = "crates/ports" }
ben_snipes-application = { path = "crates/application" }
ben_snipes-config = { path = "crates/config" }
ben_snipes-adapter-statefile = { path = "crates/adapters/statefile" }
ben_snipes-adapter-ws-support = { path = "crates/adapters/ws-support" }
ben_snipes-adapter-pumpfun = { path = "crates/adapters/pumpfun" }
ben_snipes-adapter-evm-onchain = { path = "crates/adapters/evm-onchain" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
