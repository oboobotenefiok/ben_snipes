name: Release Android ARMv7

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Create cargo config
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi21-clang"
          ar = "llvm-ar"
          EOF

      - name: Build release binary
        env:
          CC_armv7_linux_androideabi: armv7a-linux-androideabi21-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: armv7a-linux-androideabi21-clang
        run: cargo build --release --target armv7-linux-androideabi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/armv7-linux-androideabi/release/ben_snipes
