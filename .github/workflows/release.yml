name: Release Android Termux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64 (aarch64) - Use Android NDK
          - target: aarch64-linux-android
            arch: arm64
            arch_name: ARM64 (ARMv8)
            ndk_api: 21
            rust_target: aarch64-linux-android
            use_cross: false

          # ARMv7 (arm) - Use cross (cargo) because NDK has issues
          - target: armv7-linux-androideabi
            arch: arm
            arch_name: ARMv7 (32-bit)
            ndk_api: 21
            rust_target: armv7-linux-androideabi
            use_cross: true

          # x86_64 - Use Android NDK
          - target: x86_64-linux-android
            arch: amd64
            arch_name: x86_64 (64-bit)
            ndk_api: 21
            rust_target: x86_64-linux-android
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Android NDK
        if: matrix.use_cross == false
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Configure cargo for NDK cross-compilation
        if: matrix.use_cross == false
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml << EOF
          [target.${{ matrix.rust_target }}]
          linker = "${{ matrix.target }}${{ matrix.ndk_api }}-clang"
          ar = "llvm-ar"
          EOF

      - name: Install cross for ARMv7
        if: matrix.use_cross == true
        run: cargo install cross

      - name: Build with NDK
        if: matrix.use_cross == false
        env:
          CARGO_TARGET_${{ matrix.rust_target }}_LINKER: ${{ matrix.target }}${{ matrix.ndk_api }}-clang
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Build with cross (ARMv7)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.rust_target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.rust_target }}/release/ben_snipes ben_snipes-${{ matrix.arch }}
          chmod +x ben_snipes-${{ matrix.arch }}

      - name: Generate checksum
        run: |
          sha256sum ben_snipes-${{ matrix.arch }} > ben_snipes-${{ matrix.arch }}.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ben_snipes-${{ matrix.arch }}
            ben_snipes-${{ matrix.arch }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  release-summary:
    name: Create Release Summary
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate release summary
        run: |
          cat > RELEASE_SUMMARY.md << 'EOF'
          # ben_snipes Release ${{ github.ref_name }}

          ## Android Architecture Support

          This release includes binaries for all Termux-compatible Android architectures:

          | Architecture | Binary | Description |
          |--------------|--------|-------------|
          | **ARM64 (ARMv8)** | [ben_snipes-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ben_snipes-arm64) | Modern Android devices (most common) |
          | **ARMv7 (32-bit)** | [ben_snipes-arm](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ben_snipes-arm) | Older Android devices |
          | **x86_64** | [ben_snipes-amd64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ben_snipes-amd64) | Android emulators/Chromebooks |

          ## Quick Install

          Run this command in Termux to automatically detect and install the correct version:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          ```

          ## Manual Install

          For manual installation, determine your architecture first:

          ```bash
          # Check your architecture
          uname -m
          # aarch64 -> ARM64 (ARMv8)
          # armv7l -> ARMv7
          # x86_64 -> AMD64

          # Download the appropriate binary
          # For ARM64 (most common):
          curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ben_snipes-arm64
          chmod +x ben_snipes-arm64
          mv ben_snipes-arm64 ben_snipes

          # Verify checksum
          sha256sum -c ben_snipes-arm64.sha256
          ```

          ## Configuration

          After installation, run the setup script to configure your environment:

          ```bash
          ./ben_snipes-wrapper
          ```

          ## Changelog

          See the [full changelog](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for all changes.

          ## Important Notes

          - Test in detection-only mode first (without setting SOLANA_PRIVATE_KEY)
          - Start with minimum position size (0.01 SOL)
          - Monitor the bot's behavior for the first hour
          - Never share your private key
          - Backup your configuration
          EOF

      - name: Update release with summary
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_SUMMARY.md
          fail_on_unmatched_files: true
